name: Public site checks
on:
  pull_request:
    branches: [main, development, staging]
  push:
    branches: [main, development, staging, feat/public-landing-release]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_PASSWORD: haven_local_tests_only
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:backend
      - run: npm ci --ignore-scripts
        working-directory: member-app
      - run: npm audit --audit-level=high
        working-directory: member-app
      - run: npm run typecheck && npm test && npm run build
        working-directory: member-app
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npx playwright test --config member-playwright.config.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-site
          path: dist/
          include-hidden-files: true
          retention-days: 7
